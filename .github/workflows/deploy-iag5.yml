name: Deploy to IAG5 on merge

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ref to deploy (defaults to main HEAD)"
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-iag5
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: iag5-shared-lab

    env:
      PLATFORM_URL: ${{ vars.PLATFORM_URL }}
      CLUSTER_ID:   ${{ vars.GATEWAY_CLUSTER_ID }}
      REPO_URL:     https://github.com/${{ github.repository }}.git
      SHA:          ${{ github.event.inputs.ref || github.sha }}

    steps:
      - name: Get Platform access token
        id: auth
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST "${PLATFORM_URL}/oauth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.PLATFORM_CLIENT_ID }}&client_secret=${{ secrets.PLATFORM_CLIENT_SECRET }}&grant_type=client_credentials" \
            | jq -r '.access_token')
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "Failed to obtain access token" >&2
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Validate import.yml
        run: |
          set -euo pipefail
          curl -fsS -X POST "${PLATFORM_URL}/gateway_manager/v1/gateways/${CLUSTER_ID}/configuration/import" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg url "$REPO_URL" --arg sha "$SHA" \
                '{options: {source: "git", git: {url: $url, file: "import.yml", reference: $sha}, validate: true}}')"

      - name: Dry-run diff
        run: |
          set -euo pipefail
          curl -fsS -X POST "${PLATFORM_URL}/gateway_manager/v1/gateways/${CLUSTER_ID}/configuration/import" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg url "$REPO_URL" --arg sha "$SHA" \
                '{options: {source: "git", git: {url: $url, file: "import.yml", reference: $sha}, check: true}}')" \
            | tee /tmp/diff.json
          {
            echo "### Planned changes"
            echo '```json'
            jq . /tmp/diff.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: |
          set -euo pipefail
          curl -fsS -X POST "${PLATFORM_URL}/gateway_manager/v1/gateways/${CLUSTER_ID}/configuration/import" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg url "$REPO_URL" --arg sha "$SHA" \
                '{options: {source: "git", git: {url: $url, file: "import.yml", reference: $sha}, force: true}}')" \
            | tee /tmp/result.json
          {
            echo "### Applied"
            echo '```json'
            jq . /tmp/result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
